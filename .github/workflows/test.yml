name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  # The codemod rewrites other people's source files, so a release that cannot
  # be built and installed cleanly is worse than no release. This job builds
  # the distributions and exercises the CLI from an installed wheel rather than
  # from the source tree.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl

      - name: Smoke test the installed CLI
        run: |
          /tmp/fresh/bin/mcp-codemod --help
          mkdir -p /tmp/sample
          cat > /tmp/sample/server.py <<'EOF'
          from mcp.server.fastmcp import FastMCP
          from mcp.types import Tool

          mcp = FastMCP("demo")
          tool = Tool(name="t", inputSchema={"type": "object"})
          print(tool.inputSchema)
          EOF
          /tmp/fresh/bin/mcp-codemod /tmp/sample --write
          echo "--- result ---"
          cat /tmp/sample/server.py
          # The rename must have been applied to the attribute access...
          grep -q "print(tool.input_schema)" /tmp/sample/server.py
          # ...and must NOT have been applied to the constructor kwarg.
          grep -q 'inputSchema={"type": "object"}' /tmp/sample/server.py
          echo "OK: attribute rewritten, keyword argument preserved"
